# Cargo configuration for optimized builds on M2

[build]
# Use all available CPU cores for parallel compilation
jobs = 0  # 0 means use all available cores

# Incremental compilation for faster rebuilds
incremental = true

# Use pipelined compilation for better performance
pipelined-compilation = true

[profile.release]
# Optimization settings
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# ARM64/M2 specific optimizations
[target.aarch64-apple-darwin]
rustflags = [
  "-C", "target-cpu=native",
  "-C", "target-feature=+neon,+fp-armv8,+crc",
]

# Intel Mac optimizations (for universal builds)
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "target-cpu=native",
]

# Windows cross-compilation
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# Registry settings for faster dependency fetching
[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"
